name: Publish Package to npm

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify package artifact
        run: bun run test:package

      - name: Publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          bun -e '
            const { version } = await Bun.file("package.json").json();
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`Tag must match package version: v${version}`);
            }
            if (!process.env.NPM_CONFIG_TOKEN) {
              throw new Error("NPM_TOKEN is required");
            }
          '
          bun publish --ignore-scripts --access public --registry https://registry.npmjs.org --tag "$NPM_TAG"
